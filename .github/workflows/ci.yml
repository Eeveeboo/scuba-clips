name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.15"
      - run: uv sync --locked
      - run: uv run cli lint
      - run: uv run cli typecheck
      - run: uv run cli check-config-example
      - run: uv run ruff check api tests
      - run: uv run pytest
