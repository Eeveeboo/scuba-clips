# The harness tools are Python.  `uv run` builds .venv from this file and
# uv.lock, so another machine needs uv and OpenSCAD only.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scuba-clips"
version = "0.1.0"
description = "Parametric OpenSCAD clips for organising scuba hose"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "numpy>=1.26",
    "pillow>=10.3",
    "solidpython2>=2.1.3",
]

[project.scripts]
cli = "tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lib", "models", "tools"]

[dependency-groups]
dev = [
    "ty>=0.0.79",
    "ruff>=0.16.8",
]

# Hold packages back for 14 days. Keep this in the project config so the
# lockfile matches on CI, which has no global uv config.
[tool.uv]
exclude-newer = "14 days"

# These three are newer than that window and are needed now, so exempt them.
exclude-newer-package = { solidpython2 = false, ty = false, ruff = false }
