<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scuba Clips editor</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        background: #14171c;
        color: #e8edf4;
      }
      header {
        padding: 1rem 1.25rem 0.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
      }
      header p {
        margin: 0.25rem 0 0;
        color: #93a1b3;
      }
      main.layout {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(18rem, 26rem) 1fr;
        gap: 1rem;
        padding: 0.5rem 1.25rem 1.25rem;
        align-items: stretch;
      }
      #form {
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        padding-right: 0.25rem;
      }
      #viewer {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #preview {
        flex: 1;
        min-height: 0;
        width: 100%;
        background: #20242b;
        border-radius: 0.5rem;
        overflow: hidden;
      }
      fieldset {
        border: 1px solid #333b46;
        border-radius: 0.5rem;
        margin: 0 0 1rem;
        padding: 0.75rem 1rem;
      }
      legend {
        padding: 0 0.4rem;
        font-weight: 600;
      }
      details {
        border: 1px solid #333b46;
        border-radius: 0.5rem;
        margin: 0 0 1rem;
      }
      summary {
        padding: 0.6rem 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
      details[open] summary {
        border-bottom: 1px solid #333b46;
      }
      details > label {
        margin: 0.6rem 0.9rem;
      }
      details > label:first-of-type {
        margin-top: 0.75rem;
      }
      details > label:last-child {
        margin-bottom: 0.75rem;
      }
      label {
        display: block;
        margin: 0.6rem 0;
      }
      label > span {
        display: block;
        font-size: 0.9rem;
      }
      input,
      select {
        width: 100%;
        margin-top: 0.2rem;
        padding: 0.35rem;
        border: 1px solid #414b58;
        border-radius: 0.35rem;
        background: #1c2129;
        color: inherit;
      }
      small {
        display: block;
        color: #93a1b3;
        margin-top: 0.15rem;
      }
      #status {
        min-height: 1.2rem;
        margin: 0.75rem 0 0;
        white-space: pre-wrap;
      }
      #status.error {
        color: #ff8f8f;
      }
      #dimensions {
        margin: 0.25rem 0 0;
        color: #93a1b3;
      }
      .downloads {
        display: flex;
        gap: 1rem;
        margin-top: 0.6rem;
      }
      .downloads a {
        color: #8ecbff;
      }
      @media (max-width: 52rem) {
        body {
          height: auto;
          min-height: 100dvh;
          overflow: visible;
        }
        main.layout {
          grid-template-columns: 1fr;
        }
        #form {
          overflow: visible;
        }
        #preview {
          flex: none;
          height: 60vh;
          min-height: 20rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Scuba Clips editor</h1>
      <p>
        Set the clip values and check the preview. The page keeps every value in
        the URL, so a copied link reproduces the same clip.
      </p>
    </header>
    <main class="layout">
      <form id="form">
        <fieldset>
          <legend>Model</legend>
          <label>
            <span>Clip</span>
            <select id="model" name="model"></select>
          </label>
        </fieldset>
        <div id="sections"></div>
      </form>
      <section id="viewer">
        <div id="preview"></div>
        <p id="status" role="status" aria-live="polite"></p>
        <p id="dimensions" aria-live="polite"></p>
        <div class="downloads">
          <a id="download-stl" hidden download="clip.stl">Download STL</a>
          <a id="download-scad" hidden download="clip.scad">Download SCAD</a>
        </div>
      </section>
    </main>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js",
          "three/addons/": "/vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
